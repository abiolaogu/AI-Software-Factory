  domain_events: docs/domain/domain-events.md
  use_cases: docs/domain/use-cases.md
  repository_interfaces: docs/domain/repository-interfaces.md
  policies: docs/domain/policies-validations.md
  value_objects: docs/domain/value-objects.md
  state_machines: docs/domain/state-machines.md
  edge_cases: docs/domain/edge-cases.md
