  api_contracts: docs/api/auth-tenant-webhook-ratelimit-idempotency.md
  architecture_review: docs/architecture-review-v1.md
  adrs: docs/adr/

# ─────────────────────────────────────────────────────────────
# Codex Build Rules
# ─────────────────────────────────────────────────────────────

codex_rules:
  - "TDD: Write failing tests FIRST. Then implement. Then refactor."
  - "Every aggregate method MUST check invariants from docs/domain/aggregates.md"
  - "Every state transition MUST enforce the state machine from docs/domain/state-machines.md"
  - "Every repository MUST implement the interface from docs/domain/repository-interfaces.md"
  - "Every domain event MUST use typed proto payload from api/proto/sdx/v1/events.proto"
  - "Every error MUST use a code from docs/api/error-catalog.md"
  - "Every edge case from docs/domain/edge-cases.md MUST have a corresponding test"
  - "No business logic in adapters. Adapters are dumb translators."
  - "No ORM. Use raw SQL with sqlx for YugabyteDB. Use ClickHouse Go driver."
  - "All SQL queries MUST include WHERE tenant_id = $1 (enforced by review)"
  - "Use google.protobuf.Any for event payloads. Register all payload types."
  - "Use ULID for all IDs. No UUID. No auto-increment."
  - "Log with slog. Structured JSON. Include tenant_id, build_id, trace_id."
  - "Context propagation: tenant_id flows from gRPC metadata → context.Context → all layers"
  - "Zero allocation in hot paths. Use sync.Pool for reusable buffers."
  - "Prefer composition over inheritance. No embedding unless justified."
  - "All public functions MUST have GoDoc comments."
  - "Dependencies: Apache-2.0, MIT, MPL-2.0, BSD only. No GPL."
