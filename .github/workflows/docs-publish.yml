name: docs-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: true

      - uses: actions/configure-pages@v5

      - name: Sync contract artifacts
        run: |
          make tidy
          make proto
          bash scripts/compliance/openapi-drift.sh

      - name: Validate docs routes
        run: |
          make swagger
          make redoc

      - name: Build static docs site
        run: bash tools/compliance/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
