name: sbom-generation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Build container images
        run: |
          docker build -f Dockerfile.api -t neuroforge-sdx-api:${{ github.sha }} .
          docker build -f Dockerfile.worker -t neuroforge-sdx-worker:${{ github.sha }} .

      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          syft dir:. -o spdx-json=sbom/source.spdx.json
          syft docker:neuroforge-sdx-api:${{ github.sha }} -o spdx-json=sbom/api-image.spdx.json
          syft docker:neuroforge-sdx-worker:${{ github.sha }} -o spdx-json=sbom/worker-image.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom
