name: sbom-generation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action/download-syft@v0

      - name: Build container images
        run: |
          docker build -f Dockerfile.api -t neuroforge-sdx-api:${{ github.sha }} .
          docker build -f Dockerfile.worker -t neuroforge-sdx-worker:${{ github.sha }} .

      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          syft dir:. -o spdx-json=sbom/source.spdx.json
          syft docker:neuroforge-sdx-api:${{ github.sha }} -o spdx-json=sbom/api-image.spdx.json
          syft docker:neuroforge-sdx-worker:${{ github.sha }} -o spdx-json=sbom/worker-image.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom
