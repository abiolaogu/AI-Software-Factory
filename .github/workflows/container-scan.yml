name: container-scan

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t neuroforge-sdx-api:${{ github.sha }} .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t neuroforge-sdx-worker:${{ github.sha }} .

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neuroforge-sdx-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy scan worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neuroforge-sdx-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
