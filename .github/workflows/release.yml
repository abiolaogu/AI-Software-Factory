name: release

on:
  push:
    tags:
      - "ai-software-factory/v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.8"
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Sync dependencies
        run: make tidy

      - name: Contract artifact drift
        run: |
          make proto
          bash scripts/compliance/openapi-drift.sh

      - name: Release verification
        run: |
          make swagger
          make redoc
          make ci
          make test-integration
          make compliance-test
          make helm-validate

      - name: Build binaries
        run: make build

      - name: Package release artifacts
        run: |
          mkdir -p release-artifacts
          cp bin/api-server release-artifacts/
          cp bin/worker release-artifacts/
          cp bin/mock-api release-artifacts/
          cp api/openapi/openapi.yaml release-artifacts/
          cp api/openapi/openapi.json release-artifacts/
          cp api/proto/neuroforge/sdx/v1/sdx.proto release-artifacts/
          sha256sum release-artifacts/* > release-artifacts/checksums.txt

      - name: Package integration release assets
        env:
          INTEGRATION_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/integration/validate-exports.mjs
          node scripts/integration/validate-docs.mjs
          node scripts/integration/validate-governance-mode.mjs
          node scripts/integration/package-release-artifacts.mjs
          node scripts/integration/validate-release-artifacts.mjs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-artifacts/api-server
            release-artifacts/worker
            release-artifacts/mock-api
            release-artifacts/openapi.yaml
            release-artifacts/openapi.json
            release-artifacts/sdx.proto
            release-artifacts/checksums.txt
            release-artifacts/integration/integration-release-manifest.json
            release-artifacts/integration/ai-software-factory-openapi-*.tgz
            release-artifacts/integration/ai-software-factory-proto-*.tgz
            release-artifacts/integration/ai-software-factory-connect-typescript-*.tgz
            release-artifacts/integration/ai-software-factory-schemas-*.tgz
            release-artifacts/integration/ai-software-factory-compatibility-*.json
