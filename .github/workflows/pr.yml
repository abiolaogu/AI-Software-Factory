name: pr-validation

on:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.8"
          cache: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Sync dependencies
        run: make tidy

      - name: Proto drift
        run: make proto

      - name: OpenAPI generation
        run: bash scripts/compliance/openapi-drift.sh

      - name: Swagger docs routes
        run: make swagger

      - name: Redoc docs routes
        run: make redoc

      - name: Lint
        run: make lint

      - name: Complexity threshold
        run: make complexity

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

      - name: Contract tests
        run: make test-contract

      - name: Coverage threshold
        run: make coverage

      - name: Migration checks
        run: bash scripts/compliance/migration-safety.sh

      - name: Helm chart validation
        run: make helm-validate

      - name: Compliance terminal
        run: |
          make contract-test
          make auth-test
          make quota-test
          make negative-test

      - name: Build binaries
        run: make build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-coverage
          path: |
            coverage.out
            coverage.html

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.8"
          cache: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Semgrep scan
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
          semgrep --config p/ci --error .

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
