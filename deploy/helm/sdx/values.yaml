# ─────────────────────────────────────────────────────────────
# NeuroForge SDX — Default Helm Values
# ─────────────────────────────────────────────────────────────

# ── Global ──
global:
  imageRegistry: ""
  imagePullSecrets: []

# ── Gateway ──
gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/stratogroup/neuroforge-sdx/sdx-gateway
    tag: ""  # Defaults to Chart appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpcPort: 9090
    httpPort: 8080
    metricsPort: 9091
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    LOG_LEVEL: info
    LOG_FORMAT: json
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability:4317"
    NATS_URL: "nats://nats.sdx-system:4222"
    DRAGONFLY_URL: "dragonfly.sdx-system:6379"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
    prometheus.io/path: "/metrics"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# ── Auth ──
auth:
  issuerUrl: "https://auth.sdx.stratogroup.io/application/o/sdx/"
  jwksUrl: "https://auth.sdx.stratogroup.io/application/o/sdx/jwks/"
  audience: "sdx-api"

# ── Database ──
database:
  host: yugabytedb-ysql.sdx-system
  port: 5433
  name: sdx
  sslMode: require
  existingSecret: sdx-db-credentials
  secretKeys:
    username: username
    password: password

# ── YugabyteDB subchart ──
yugabytedb:
  enabled: true

# ── ClickHouse subchart ──
clickhouse:
  enabled: true
