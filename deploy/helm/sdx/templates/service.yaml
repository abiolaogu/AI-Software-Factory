apiVersion: v1
kind: Service
metadata:
  name: {{ include "sdx.fullname" . }}-gateway
  labels:
    {{- include "sdx.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.gateway.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.gateway.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "sdx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
